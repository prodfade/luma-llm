databases:
  - name: luma-db
    plan: 0.1c-256mb
    databaseName: luma
    user: luma

services:
  - type: web
    name: luma-personal-llm
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOW_SIGNUP
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: luma-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: QWEN_API_KEY
        sync: false
      - key: AXFORGE_MODEL
        value: qwen3.8-27b-nvfp4

